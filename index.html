<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Culebra X</title>

    <link rel="stylesheet" href="culebra.css">
</head>

<body>

    <header>
        <h1>CULEBRA X</h1>
        <p>Autor: ANTHONY REGALADO</p>
    </header>

    <main>

        <!-- Panel de información -->
        <section class="panel">

            <div>
                <span>Puntos:</span>
                <span id="puntos">0</span>
            </div>

            <div>
                <span>Tiempo:</span>
                <span id="tiempo">0</span>
            </div>

        </section>

        <!-- Tablero del videojuego -->
        <section class="contenedor-juego">

            <canvas id="areaJuego" width="500" height="500">
                Tu navegador no soporta Canvas.
            </canvas>

            <!-- Diálogo propio para el nombre del jugador (sin alert ni prompt) -->
            <div id="dialogoNombre" class="dialogo" hidden role="dialog" aria-modal="true" aria-labelledby="tituloDialogo">
                <div class="dialogo-caja">
                    <h2 id="tituloDialogo">¿QUIÉN JUEGA?</h2>
                    <p id="textoDialogo">Escribe tu nombre para el ranking</p>
                    <input id="campoNombre" type="text" maxlength="12" autocomplete="off" autocapitalize="words"
                           spellcheck="false" placeholder="Tu nombre" aria-label="Nombre del jugador">
                    <p id="errorNombre" class="dialogo-error" role="alert"></p>
                    <div class="dialogo-botones">
                        <button type="button" id="btnConfirmarNombre">CONFIRMAR</button>
                        <button type="button" id="btnCancelarNombre">CANCELAR</button>
                    </div>
                </div>
            </div>

            <p id="mensaje">Presiona iniciar para jugar</p>

        </section>

        <!-- Controles -->
        <section class="controles">

            <button type="button" onclick="moverArriba()">⬆</button>

            <div>
                <button type="button" onclick="moverIzquierda()">⬅</button>
                <button type="button" onclick="moverAbajo()">⬇</button>
                <button type="button" onclick="moverDerecha()">➡</button>
            </div>

        </section>

        <!-- Botones del juego -->
        <section class="acciones">

            <button type="button" onclick="iniciarJuego()">INICIAR<small class="atajo">Enter</small></button>

            <button type="button" onclick="pausarJuego()">PAUSAR<small class="atajo">Espacio / P</small></button>

            <button type="button" onclick="reiniciarPorJugador()">REINICIAR<small class="atajo">R</small></button>

        </section>

        <p class="ayuda-teclas">Flechas: mover · Enter: iniciar · Espacio o P: pausa · R: reiniciar · M: música · T: ranking</p>

    </main>

    <!-- Archivos JavaScript -->
    <!-- Orden importante: utilitarios -> eventos -> culebra (este último arranca el juego) -->
    <script src="utilitarios.js"></script>
    <script src="culebra_eventos.js"></script>
    <script src="culebra.js"></script>

</body>
</html>
